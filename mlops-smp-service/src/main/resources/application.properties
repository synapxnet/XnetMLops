spring.application.name=mlops-smp-service
# Server port
server.port=8185

# JDBC URL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetMLops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false

# Database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

hdfs.path=hdfs://${HDFS_HOST:localhost}:${HDFS_PORT:8020}
hdfs.user= atguigu

# Jenkins ?????
jenkins.url=http://${JENKINS_HOST:localhost}:${JENKINS_PORT:8080}
jenkins.username=atguigu
jenkins.api-token=${JENKINS_API_TOKEN}

logging.level.root=debug

# MyBatis configuration
mybatis.configuration.map-underscore-to-camel-case=true
