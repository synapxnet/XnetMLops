# Kubernetes 漂移令牌挂载补丁 / Kubernetes feature-drift credential mount patch.
# Author: maoyo | Department: 研发部 | Date: 2026-10-23 | Version: 1.0.0
# Security Level: INTERNAL | Maintainer: maoyo | Email: synapxnet@gmail.com
# 先通过部署凭据流程创建 Secret xnet-mlops-feature-drift（键 token）。 / First provision Secret xnet-mlops-feature-drift with key token through your credential workflow.
# 在 xnet-mlops-runtime 显式配置 ENABLED、RUNTIME_URL 和 RESOURCE_IDS。 / Configure OPENXNET_FEATURE_DRIFT_ENABLED, OPENXNET_FEATURE_DRIFT_RUNTIME_URL and OPENXNET_FEATURE_DRIFT_RESOURCE_IDS explicitly in xnet-mlops-runtime.
# kubectl -n xnet-mlops patch deployment mlops-mep-service --type strategic --patch-file deploy/feature-drift-secret.patch.example.yaml
spec:
  template:
    spec:
      containers:
        - name: mlops-mep-service
          env:
            - name: OPENXNET_FEATURE_DRIFT_TOKEN_FILE
              value: /run/secrets/xnet_mlops_feature_drift_token
          volumeMounts:
            - name: feature-drift-role-token
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: feature-drift-role-token
          secret:
            secretName: xnet-mlops-feature-drift
            defaultMode: 256
            items:
              - key: token
                path: xnet_mlops_feature_drift_token
