# 服务名称与端口
spring.application.name=mlops-mtp-service
server.port=8183

# MLOps 元数据库
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetMLops?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# HDFS 配置
hdfs.path=hdfs://${HDFS_HOST:localhost}:${HDFS_PORT:8020}
hdfs.user=atguigu

# 文件上传限制
spring.servlet.multipart.max-file-size=100GB
spring.servlet.multipart.max-request-size=100GB

# 长任务连接配置
server.tomcat.connection-timeout=1800000
server.tomcat.keep-alive-timeout=30000

# 临时文件目录
chunked.temp.dir=/data/tmp/uploads
app.temp.dir=/data/tmp

# Jenkins 训练编排配置
jenkins.url=http://${JENKINS_HOST:localhost}:${JENKINS_PORT:8080}
jenkins.username=atguigu
jenkins.api-token=${JENKINS_API_TOKEN:}

# redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 日志级别
logging.level.root=debug

# DataOps 已发布推荐数据产品只读连接。
xnet.recommendation.jdbc-url=${RECOMMENDATION_PG_URL:jdbc:postgresql://127.0.0.1:55432/recommendation}
xnet.recommendation.username=${RECOMMENDATION_MLOPS_DB_USERNAME:recommendation_mlops_reader}
xnet.recommendation.password=${RECOMMENDATION_MLOPS_DB_PASSWORD:}

# CPU DCN 训练运行时。
xnet.recommendation-training.python=${RECOMMENDATION_TRAINING_PYTHON:python}
xnet.recommendation-training.script=${RECOMMENDATION_TRAINING_SCRIPT:/opt/xnetmlops/recommendation-training/train_dcn.py}
xnet.recommendation-training.output-root=${RECOMMENDATION_TRAINING_OUTPUT_ROOT:/data/mlops/recommendation}
xnet.recommendation-training.timeout-seconds=${RECOMMENDATION_TRAINING_TIMEOUT_SECONDS:600}
xnet.recommendation-training.epochs=${RECOMMENDATION_TRAINING_EPOCHS:3}
