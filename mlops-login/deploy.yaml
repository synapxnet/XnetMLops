---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xnet-mlops-login-deployment
  namespace: xnet-mlops
  labels:
    app: xnet-mlops-login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xnet-mlops-login
  template:
    metadata:
      labels:
        app: xnet-mlops-login
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: xnet-mlops-login
          image: 192.168.10.132/xnet-mlops/xnet-mlops-login:${BUILD_NUMBER}
          ports:
            - name: tcp-8181
              containerPort: 8181
              protocol: TCP
          # 运行环境与凭据由集群配置注入。 Inject runtime settings and credentials from cluster configuration.
          envFrom:
            - configMapRef:
                name: xnet-mlops-runtime
            - secretRef:
                name: xnet-mlops-secrets
          resources:
            limits:
              cpu: "50"
              memory: "16482Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            defaultMode: 420
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: xnet-mlops-login
  namespace: xnet-mlops
  labels:
    app: xnet-mlops-login
spec:
  selector:
    app: xnet-mlops-login
  ports:
    - protocol: TCP
      port: 8181
      targetPort: 8181
      name: tcp-8181
  type: ClusterIP
