server {
    listen 80;
    server_name localhost;

    # 内部组织范围校验，业务接口不相信客户端自声明的团队。
    location = /_organization_access {
        internal;
        proxy_pass http://mlops-login:8181/api/auth/organization-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Uid $http_x_tenant_uid;
        proxy_set_header X-Dept-Uid $http_x_dept_uid;
        proxy_set_header X-Team-Uid $http_x_team_uid;
    }

    # 入口文件禁止缓存，确保部署后立即加载最新资源清单。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /_app.config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 登录服务
    location /api/login/ {
        proxy_pass http://mlops-login:8181/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 数据处理平台
    location /api/dpp/ {
        auth_request /_organization_access;
        proxy_pass http://mlops-dpp-service:8182/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
    }

    # 模型训练平台
    location /api/mtp/ {
        auth_request /_organization_access;
        proxy_pass http://mlops-mtp-service:8183/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
    }

    # 模型端点平台
    location /api/mep/ {
        auth_request /_organization_access;
        proxy_pass http://mlops-mep-service:8184/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 服务器管理平台
    location /api/smp/ {
        auth_request /_organization_access;
        proxy_pass http://mlops-smp-service:8185/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # XAA 服务
    location /api/xaa/ {
        auth_request /_organization_access;
        proxy_pass http://mlops-xaa-service:8186/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
