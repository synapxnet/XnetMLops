# Installed as an official Nginx entrypoint template; configured environment values are substituted at startup.
server {
    listen 80;
    server_name localhost;

    location = /_organization_access {
        internal;
        proxy_pass http://${XNET_LOGIN_UPSTREAM}/api/auth/organization-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Uid $http_x_tenant_uid;
        proxy_set_header X-Dept-Uid $http_x_dept_uid;
        proxy_set_header X-Team-Uid $http_x_team_uid;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /_app.config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 驻场运行时独立配置；未连接明确返回不可用。 Configure the independent resident runtime explicitly.
    location ^~ /api/resident/v1/ {
        auth_request /_organization_access;
        set $resident_backend "${XNET_RESIDENT_AGENT_URL}";
        resolver ${XNET_DNS_RESOLVER} valid=30s ipv6=off;
        if ($resident_backend = "") {
            return 503 '{"code":503,"message":"Resident runtime is not configured","data":null}';
        }
        proxy_pass $resident_backend$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Agent 工具由后端验证委派、上下文及审批。 Agent tools verify delegation, context and approval in the backend.
    location ^~ /api/agent/v1/ {
        proxy_pass http://${XNET_MEP_UPSTREAM};
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # 登录和组织接口保留 Controller 的 /api 前缀。 Preserve the login controller API prefix.
    location ^~ /api/ {
        proxy_pass http://${XNET_LOGIN_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端 /dpp/ 基址映射到真实 Controller。 Map the frontend base to the actual controller.
    location ^~ /dpp/ {
        auth_request /_organization_access;
        proxy_pass http://${XNET_DPP_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 前端 /mtp/ 基址映射到真实 Controller。 Map the frontend base to the actual controller.
    location ^~ /mtp/ {
        auth_request /_organization_access;
        proxy_pass http://${XNET_MTP_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 前端 /smp/ 基址映射到真实 Controller。 Map the frontend base to the actual controller.
    location ^~ /smp/ {
        auth_request /_organization_access;
        proxy_pass http://${XNET_SMP_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 前端 /mep/ 基址映射到真实 Controller。 Map the frontend base to the actual controller.
    location ^~ /mep/ {
        auth_request /_organization_access;
        proxy_pass http://${XNET_MEP_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 前端 /xaa/ 基址映射到真实 Controller。 Map the frontend base to the actual controller.
    location ^~ /xaa/ {
        auth_request /_organization_access;
        proxy_pass http://${XNET_XAA_UPSTREAM}/api/xaa/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
