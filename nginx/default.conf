server {
    listen 80;
    server_name localhost;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 登录服务
    location /api/login/ {
        proxy_pass http://mlops-login:8181/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 数据处理平台
    location /api/dpp/ {
        proxy_pass http://mlops-dpp-service:8182/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
    }

    # 模型训练平台
    location /api/mtp/ {
        proxy_pass http://mlops-mtp-service:8183/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100g;
        proxy_read_timeout 1800s;
    }

    # 模型端点平台
    location /api/mep/ {
        proxy_pass http://mlops-mep-service:8184/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 服务器管理平台
    location /api/smp/ {
        proxy_pass http://mlops-smp-service:8185/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # XAA 服务
    location /api/xaa/ {
        proxy_pass http://mlops-xaa-service:8186/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
