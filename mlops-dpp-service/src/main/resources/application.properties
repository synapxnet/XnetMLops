spring.application.name=mlops-dpp-service

# encoding = UTF-8
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 服务端口
server.port=8182

# JDBC URL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetMLops?useSSL=false&serverTimezone=UTC

# 元数据库用户名
spring.datasource.username=root

# 元数据库密码
spring.datasource.password=${DB_PASSWORD}

hdfs.path=hdfs://${HDFS_HOST:localhost}:${HDFS_PORT:8020}
hdfs.user= atguigu

# application.properties
# 单文件上传上限
spring.servlet.multipart.max-file-size=100GB
spring.servlet.multipart.max-request-size=100GB

# 长任务连接超时
server.tomcat.connection-timeout=1800000
# HTTP 保持连接时间
server.tomcat.keep-alive-timeout=30000

# 分片上传临时目录
chunked.temp.dir=/data/tmp/uploads
# 通用临时目录
app.temp.dir=/data/tmp

logging.level.root=debug

# Jenkins 训练编排配置
jenkins.url=http://${JENKINS_HOST:localhost}:${JENKINS_PORT:8080}
jenkins.username=atguigu
jenkins.api-token=${JENKINS_API_TOKEN:}

# MyBatis 配置 - 关闭自动驼峰映射，使用@Results手动映射
mybatis.configuration.map-underscore-to-camel-case=false

# XnetDataOps 数据产品接口，仅允许导入已发布版本。
xnet.dataops.base-url=${XNET_DATAOPS_API_BASE_URL:http://127.0.0.1:9284}
xnet.dataops.service-token=${XNET_DATAOPS_SERVICE_TOKEN:}
