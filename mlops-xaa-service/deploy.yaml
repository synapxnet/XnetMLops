apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-xaa-service
  namespace: xnet-mlops
  labels:
    app: mlops-xaa-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-xaa-service
  template:
    metadata:
      labels:
        app: mlops-xaa-service
    spec:
      containers:
        - name: mlops-xaa-service
          image: mlops-xaa-service:latest
          ports:
            - containerPort: 8186
          # 运行环境与凭据由集群配置注入。 Inject runtime settings and credentials from cluster configuration.
          envFrom:
            - configMapRef:
                name: xnet-mlops-runtime
            - secretRef:
                name: xnet-mlops-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-xaa-service
  namespace: xnet-mlops
spec:
  selector:
    app: mlops-xaa-service
  ports:
    - protocol: TCP
      port: 8186
      targetPort: 8186
  type: ClusterIP
