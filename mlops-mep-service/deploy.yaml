apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-mep-service
  namespace: xnet-mlops
  labels:
    app: mlops-mep-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-mep-service
  template:
    metadata:
      labels:
        app: mlops-mep-service
    spec:
      containers:
        - name: mlops-mep-service
          image: 192.168.10.132/xnet-mlops/mlops-mep-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8184
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TZ
              value: "Asia/Shanghai"
          # 运行环境与凭据由集群配置注入。 Inject runtime settings and credentials from cluster configuration.
          envFrom:
            - configMapRef:
                name: xnet-mlops-runtime
            - secretRef:
                name: xnet-mlops-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 8184
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8184
            initialDelaySeconds: 30
            periodSeconds: 10
      imagePullSecrets:
        - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-mep-service
  namespace: xnet-mlops
  labels:
    app: mlops-mep-service
spec:
  type: ClusterIP
  ports:
    - port: 8184
      targetPort: 8184
      protocol: TCP
      name: http
  selector:
    app: mlops-mep-service
