apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-mep-service
  namespace: xnet-mlops
  labels:
    app: mlops-mep-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-mep-service
  template:
    metadata:
      labels:
        app: mlops-mep-service
    spec:
      containers:
        - name: mlops-mep-service
          image: 192.168.10.132/xnet-mlops/mlops-mep-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8186
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8186
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8186
            initialDelaySeconds: 30
            periodSeconds: 10
      imagePullSecrets:
        - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-mep-service
  namespace: xnet-mlops
  labels:
    app: mlops-mep-service
spec:
  type: ClusterIP
  ports:
    - port: 8186
      targetPort: 8186
      protocol: TCP
      name: http
  selector:
    app: mlops-mep-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-mep-service-ingress
  namespace: xnet-mlops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: mep.mlops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlops-mep-service
                port:
                  number: 8186
