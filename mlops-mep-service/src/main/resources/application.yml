server:
  port: 8184

spring:
  application:
    name: mlops-mep-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetMLops?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.synapxnet.mlopsmepservice.entity
  configuration:
    map-underscore-to-camel-case: true

# Docker配置
docker:
  host: unix:///var/run/docker.sock
  api-version: 1.43

# Nginx配置
nginx:
  config-path: /etc/nginx/conf.d
  reload-command: nginx -s reload

# MTP服务配置
mtp:
  service:
    url: ${MTP_SERVICE_URL:http://localhost:8183}

# SMP服务配置
smp:
  service:
    url: ${SMP_SERVICE_URL:http://localhost:8185}

logging:
  level:
    com.synapxnet.mlopsmepservice: DEBUG
    org.springframework.web: INFO

# 委派与审批配置，缺少密钥时拒绝执行。 / Delegation and approval fail closed without credentials.
openxnet:
  agent:
    delegation-secret: ${OPENXNET_AGENT_DELEGATION_SECRET:}
    audience: ${OPENXNET_AGENT_AUDIENCE:openxnet-agent-adapter}
  approval:
    base-url: ${OPENXNET_APPROVAL_BASE_URL:http://127.0.0.1:3456}
    service-token: ${OPENXNET_APPROVAL_SERVICE_TOKEN:}

# 未配置运行时只连接本机不可用端点，不能伪造运行结果。 / Unconfigured runtimes cannot fabricate execution results.
xnet:
  recommendation:
    runtime-url: ${RECOMMENDATION_RUNTIME_URL:http://127.0.0.1:19081}
    expected-algorithm-id: ${RECOMMENDATION_EXPECTED_ALGORITHM_ID:unconfigured}
    expected-product-version: ${RECOMMENDATION_EXPECTED_PRODUCT_VERSION:unconfigured}
  quantitative:
    runtime-url: ${QUANTITATIVE_RUNTIME_URL:http://127.0.0.1:19082}
    runtime-token: ${QUANTITATIVE_RUNTIME_TOKEN:}
